<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数字展销平台</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <!-- 头部区域（固定定位+浮动布局，新增登录/注册按钮） -->
    <header class="header">
        <div class="logo">
            <img src="img/logo.png" alt="新讯图书">
        </div>
        <nav class="nav">
            <a href="#">首页</a>
            <a href="#">图书分类</a>
            <a href="#">热销图书</a>
            <a href="#" id="loginBtn">登录/注册</a> <!-- 新增登录按钮 -->
        </nav>
    </header>

    <!-- 主体三栏布局 -->
    <div class="container">
        <!-- 左侧栏：图书分类（相对定位） -->
        <aside class="left-sidebar">
            <h3>图书分类</h3>
            <ul>
                <li>科幻小说</li>
                <li>历史名著</li>
                <li>科技杂志</li>
                <li>艺术图书</li>
                <li>文学作品</li>
            </ul>
        </aside>

        <!-- 中间主内容区 -->
        <main class="main-content">
            <!-- 中间banner图 -->
            <div class="banner">
                <img src="img/banner.jpg" alt="图书借阅系统">
            </div>

            <!-- 新书上市表格 -->
            <table class="book-table">
                <thead>
                    <tr>
                        <th>图书</th>
                        <th>图书名称</th>
                        <th>作者</th>
                        <th>价格</th>
                        <th>库存</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><img src="img/book1.jpg" alt="三体" width="60"></td>
                        <td>三体</td>
                        <td>刘慈欣</td>
                        <td>¥45.00</td>
                        <td>100</td>
                    </tr>
                    <tr>
                        <td><img src="img/book2.jpg" alt="人类简史" width="60"></td>
                        <td>三体全套</td>
                        <td>刘慈欣</td>
                        <td>¥120.00</td>
                        <td>80</td>
                    </tr>
                </tbody>
            </table>
        </main>

        <!-- 右侧栏：新书热销（固定定位） -->
        <aside class="right-sidebar">
            <h3>新书热销</h3>
            <div class="book-card">
                <img src="img/book1.jpg" alt="三体">
                <div class="card-info">《三体》单本</div>
            </div>
            <div class="book-card">
                <img src="img/book2.jpg" alt="三体套装">
                <div class="card-info">《人类简史》</div>
            </div>
        </aside>
    </div>

    <!-- 实验三新增：登录注册弹窗 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <!-- 登录模块 -->
            <div class="login-box" id="loginBox">
                <h2>用户登录</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <label for="loginUser">用户名</label>
                        <input type="text" id="loginUser" placeholder="请输入用户名" required>
                    </div>
                    <div class="input-group">
                        <label for="loginPwd">密码</label>
                        <input type="password" id="loginPwd" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn">登录</button>
                    <p class="toggle" id="toReg">没有账号？点击注册</p>
                </form>
            </div>

            <!-- 注册模块（默认隐藏） -->
            <div class="register-box" id="registerBox">
                <h2>用户注册</h2>
                <form id="registerForm">
                    <div class="input-group">
                        <label for="regUser">用户名</label>
                        <input type="text" id="regUser" placeholder="请设置用户名" required>
                    </div>
                    <div class="input-group">
                        <label for="regPwd">密码</label>
                        <input type="password" id="regPwd" placeholder="请设置密码" required>
                    </div>
                    <div class="input-group">
                        <label for="regConfirmPwd">确认密码</label>
                        <input type="password" id="regConfirmPwd" placeholder="请再次输入密码" required>
                    </div>
                    <button type="submit" class="btn">注册</button>
                    <p class="toggle" id="toLogin">已有账号？点击登录</p>
                </form>
            </div>
        </div>
    </div>
    <script>
// 实验三登录注册逻辑
         const loginBtn = document.getElementById('loginBtn');
         const modal = document.getElementById('modal');
         const loginBox = document.getElementById('loginBox');
         const registerBox = document.getElementById('registerBox');
         const toReg = document.getElementById('toReg');
         const toLogin = document.getElementById('toLogin');
         const loginForm = document.getElementById('loginForm');
         const registerForm = document.getElementById('registerForm');
         // 打开弹窗
         loginBtn.addEventListener('click', () => {
             modal.style.display = 'flex';
         });
         // 关闭弹窗（点击外部区域）
         window.addEventListener('click', (e) => {
             if (e.target === modal) {
                 modal.style.display = 'none';
             }
         });
         // 切换到注册
         toReg.addEventListener('click', () => {
             loginBox.style.display = 'none';
             registerBox.style.display = 'block';
         });
         // 切换到登录
         toLogin.addEventListener('click', () => {
             registerBox.style.display = 'none';
             loginBox.style.display = 'block';
         });
         // 注册功能
         registerForm.addEventListener('submit', (e) => {
             e.preventDefault();
             const username = document.getElementById('regUser').value;
             const password = document.getElementById('regPwd').value;
             const confirmPwd = document.getElementById('regConfirmPwd').value;
             if (password !== confirmPwd) {
                 alert('两次密码输入不一致！');
                 return;
             }
             // 本地存储用户信息
             localStorage.setItem(username, password);
             alert('注册成功！请登录');
             registerForm.reset();
             toLogin.click();
         });
         // 登录功能
         loginForm.addEventListener('submit', (e) => {
             e.preventDefault();
             const username = document.getElementById('loginUser').value;
             const password = document.getElementById('loginPwd').value;
             // 本地存储验证
             const storedPwd = localStorage.getItem(username);
             if (storedPwd && storedPwd === password) {
                 alert('登录成功！');
                 modal.style.display = 'none';
                 loginBtn.textContent = `欢迎，${username}`;
             } else {
                 alert('用户名或密码错误！');
             }
         });
     </script>
 </body>
 </html>
